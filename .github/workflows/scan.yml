# Runs the decoupled arbitrage scan on a schedule — replaces the Heroku worker dyno at $0.
# `npm run scan:once` (scripts/scan-once.mts) builds/loads the lock-graph from the Supabase snapshot,
# scans one batch, writes results, and exits. No timeout pressure here (Actions allows minutes), so the
# ~15-25s graph rebuild at the 6h snapshot boundary runs fine — the constraint that blocked Vercel/Heroku.
#
# NOTE: scheduled workflows only run on the repo's DEFAULT branch. Make `solana-support` the default branch
# (or merge it to the default) or this `schedule` will never fire. `workflow_dispatch` lets you test it now.
#
# Minutes: this repo is PUBLIC → UNLIMITED free Actions minutes, so cadence is now cost-free (tightened to
# */10). Each run is ~50-60s incl. cached install. (If it's ever made PRIVATE again, */10 would blow the free
# 2,000-min/mo tier — back off to ~30 min or add paid minutes.)
#
# RELIABILITY: GitHub's `schedule` fires irregularly (drops most ticks), so it's only the best-effort
# always-on backup. The PRIMARY driver is a Windows Scheduled Task on the user's PC ("arb-scan-dispatch",
# every 10 min) running `gh workflow run scan.yml --ref solana-support` via the machine's gh login — no PAT.
# Caveat: the PC must be on. For guaranteed 24/7 (PC off), the upgrade is an EXTERNAL cron (cron-job.org, free)
# POSTing the workflow_dispatch API with a fine-grained PAT (Actions:read+write on jetopen/arb ONLY):
#   POST https://api.github.com/repos/jetopen/arb/actions/workflows/scan.yml/dispatches   body: {"ref":"solana-support"} -> 204
# The `concurrency` guard below means overlapping triggers (task + schedule) queue instead of double-running.

name: arb-scan

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min — free now the repo is PUBLIC (unlimited minutes); best-effort always-on backup to the Windows task (GitHub still drops most scheduled ticks)
  workflow_dispatch: {} # manual "Run workflow" button for testing

# Never overlap runs; let an in-flight scan finish rather than starting a second.
concurrency:
  group: arb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev # scan path only needs runtime deps (tsx is a dep); skips playwright/vitest
      - name: Scan one batch
        run: npm run scan:once
        env:
          # Required — selects the Supabase store (set these as repo Actions secrets):
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional — alerts + tuning (set as secrets/vars if you use them):
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBRIDGE_API_KEY: ${{ secrets.DEBRIDGE_API_KEY }}
          # 0x aggregator key — upgrades the verifier's 1inch-routable class to verified(0x) / rehabs thin legs:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          # Knobs (plain values are fine — not secret):
          ARB_SCAN_N: "48"
          ARB_SCAN_RPM: "120"
          ARB_JUPITER_RPS: "2"
