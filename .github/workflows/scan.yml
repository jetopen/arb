# Runs the arbitrage scan as a CONTINUOUS in-process loop — replaces the Heroku worker dyno at $0.
# `npm run scan:loop` (scripts/scan-loop.mts) loads the lock-graph from the Supabase snapshot, then calls
# runScan() back-to-back for ~5.5h (under GitHub's 6h job cap). One long-lived process keeps the module-level
# RPM budget + warm graph cache (scan-service.ts singletons). Steady state is TWO-LANE: the hot lane keeps the
# proven set fresh inside the 3h read gate (~28-min cycle) while the cold-discovery sweep works the ~8.7k dead
# reps with the remaining budget (~4-5h) — the gate is held by the hot lane, NOT by full-queue cycling. This
# replaces the old one-batch-per-dispatch (scan:once) that cycled once per ~33h. The ~15-25s graph rebuild at
# the 6h boundary happens once, in-process. On sustained failure the loop exits NON-ZERO (red run → owner email).
#
# NOTE: scheduled workflows only run on the repo's DEFAULT branch. Make `solana-support` the default branch
# (or merge it to the default) or this `schedule` will never fire. `workflow_dispatch` lets you test it now.
#
# Minutes: this repo is PUBLIC → UNLIMITED free Actions minutes. That's what makes the continuous loop viable:
# one ~5.5h job burns ~330 runner-min, so ~4-5 jobs/day ≈ ~44k min/mo — fine when unlimited, but it would
# DWARF the 2,000-min/mo free tier if the repo ever went private again (revert to scan:once + */30 in that case).
#
# SELF-RESTART: each loop job self-exits (0) at ~5.5h — or 1 early on sustained failure. The `concurrency` guard below means any trigger that
# fires during the run (the */10 schedule, or the Windows task "arb-scan-dispatch" on the user's PC) is held as
# a single `pending` run and starts the INSTANT the loop ends — a seamless, PAT-free restart. So one tick per
# 5.5h is enough to stay continuous; GitHub dropping most */10 ticks is fine. The Windows task
# (`gh workflow run scan.yml --ref solana-support`, machine gh login, no PAT) covers restarts while the PC is on;
# the schedule covers PC-off. Only a total trigger loss (schedule drops ALL ticks in 5.5h AND the PC is off)
# leaves a short gap — an external cron-job.org + fine-grained PAT pinger is the only zero-gap upgrade (optional).

name: arb-scan

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min — free now the repo is PUBLIC (unlimited minutes); best-effort always-on backup to the Windows task (GitHub still drops most scheduled ticks)
  workflow_dispatch: {} # manual "Run workflow" button for testing

# Never overlap runs; let an in-flight scan finish rather than starting a second.
concurrency:
  group: arb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # backstop ABOVE the script's ~330-min self-exit; GitHub's 6h (360m) is the outer cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev # scan path only needs runtime deps (tsx is a dep); skips playwright/vitest
      - name: Continuous scan loop (~5.5h, self-restarts via concurrency)
        run: npm run scan:loop
        env:
          # Required — selects the Supabase store (set these as repo Actions secrets):
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional — alerts + tuning (set as secrets/vars if you use them):
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBRIDGE_API_KEY: ${{ secrets.DEBRIDGE_API_KEY }}
          # 0x aggregator key — upgrades the verifier's 1inch-routable class to verified(0x) / rehabs thin legs:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          # Knobs (plain values are fine — not secret):
          ARB_SCAN_N: "48"
          # 2026-07-08 INCIDENT: the transient-storm alert fired for real (48/48 units transient, 5+ ticks).
          # Root cause: DEBRIDGE_API_KEY was NEVER set as a repo secret — every quote has been hitting
          # deBridge's UNAUTHENTICATED public estimation endpoint, whose real sustained ceiling is well below
          # our own RpmBudget's 200/min. Symptom was a clean 2-tick alternation (burst of ~40-77 quotes, then
          # a near-total 429 storm the next ~30s tick) — a fixed rate-limit window filling/emptying, not a
          # random outage. The 200→120 "rollback" this comment used to document was never load-tested itself,
          # so dropping straight to 120 risked storming again; went lower for headroom instead. Concurrency
          # halved too — high concurrency blows through a short rate window in the first few requests. Durable
          # fix is a real DEBRIDGE_API_KEY (would very likely allow raising both back up); this is the interim
          # stopgap the alert message itself recommended ("Consider lowering ARB_SCAN_RPM").
          ARB_SCAN_RPM: "60"
          ARB_SCAN_CONCURRENCY: "6"
          # Hot-lane refresh floor 10m→5m (needs migration 0015 so the SQL dequeue honors it). Budget check:
          # ~70 hot rows / 5 min = 14 units/min = 28 quotes/min — small even against the old 120 RPM.
          ARB_HOT_MIN_INTERVAL_MS: "300000"
          ARB_JUPITER_RPS: "2"
          # Loop knobs (scan:loop): pause between ticks + self-exit deadline (kept < GitHub's 6h job cap).
          ARB_LOOP_INTERVAL_MS: "3000"
          ARB_LOOP_MAX_MS: "19800000" # 5.5h
